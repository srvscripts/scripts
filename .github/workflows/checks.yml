name: checks
# Runs on every push and pull request. The library is synced from srvScripts.com. Release tags (<script>/vX.Y.Z)
# are only created for a commit after every job below has passed; a red build holds the tags until it is fixed.
# Runners are pinned to ubuntu-24.04 so the ubuntu-latest move to Ubuntu 26 cannot change the toolchain unannounced.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bash:
    name: Bash scripts and checksums
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Bash syntax (bash -n)
        run: |
          shopt -s nullglob
          for f in */*.sh; do bash -n "$f" || { echo "::error file=$f::syntax error"; exit 1; }; done
      - name: ShellCheck (warnings and errors fail the build)
        run: |
          shopt -s nullglob
          shellcheck --version
          shellcheck -S warning */*.sh
      - name: Every file matches its .sha256 and index.json
        run: python3 .github/check_index.py
  powershell:
    name: PowerShell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install PSScriptAnalyzer and Pester from PSGallery (3 attempts each)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          function Install-WithRetry([string]$Name, [hashtable]$Extra) {
            for ($i = 1; $i -le 3; $i++) {
              try { Install-Module -Name $Name -Scope CurrentUser -Force -ErrorAction Stop @Extra; Write-Output "$Name installed (attempt $i)"; return }
              catch { Write-Output "::warning::Install-Module $Name attempt $i failed: $($_.Exception.Message)"; Start-Sleep -Seconds (15 * $i) }
            }
            Write-Output "::error::Install-Module $Name failed after 3 attempts (PSGallery unreachable?)"; exit 1
          }
          Install-WithRetry 'PSScriptAnalyzer' @{}
          Install-WithRetry 'Pester' @{ MinimumVersion = '5.5'; SkipPublisherCheck = $true }
      - name: Parse every script, then PSScriptAnalyzer (errors fail the build, warnings are listed)
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer -ErrorAction Stop
          $files = Get-ChildItem -Recurse -Include *.ps1,*.psm1
          $bad = 0
          foreach ($f in $files) {
            $t = $null; $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$t, [ref]$e)
            if ($e) { $bad++; Write-Output "::error file=$($f.Name)::$($e[0].Message)" }
          }
          $r = $files | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error,Warning }
          $r | ForEach-Object { Write-Output "$($_.Severity) $($_.ScriptName):$($_.Line) $($_.RuleName)" }
          $err = @($r | Where-Object Severity -eq 'Error').Count
          Write-Output "$($files.Count) files, $bad parse errors, $err analyzer errors"
          if ($bad -or $err) { Write-Output "::error::$bad parse errors, $err analyzer errors"; exit 1 }
      - name: Pester tests (M365 licence preservation decisions, mocked tenant data)
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5 -ErrorAction Stop
          $c = New-PesterConfiguration; $c.Run.Path = 'tests'; $c.Run.Exit = $true; $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c
  regression:
    name: Regression fixtures (known inputs, expected verdicts)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install test tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq restic openssl
      - name: Run tests/regression.sh
        run: sudo -E bash tests/regression.sh
